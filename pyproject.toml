[project]
name = "https-proxy-mcp"
version = "0.2.0"
description = "MCP server that captures HTTPS traffic from an app under test and interleaves it with end-to-end test steps"
readme = "README.md"
authors = [
    { name = "AdonisLima", email = "adonisjvl@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "mcp",
    "model-context-protocol",
    "mitmproxy",
    "https",
    "proxy",
    "ios-simulator",
    "maestro",
    "e2e-testing",
    "network-debugging",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    # Not decoration. Capture routes traffic with `networksetup` and installs trust with
    # `simctl`, so this is macOS-only in a way no amount of packaging can soften — a consumer on
    # Linux should learn that from the listing rather than from a confusing runtime failure.
    "Operating System :: MacOS :: MacOS X",
    # Both actually exercised: tests/test_distribution.py installs the built wheel into a clean
    # virtualenv under each and drives a real capture through it.
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    # Both ceilings are load-bearing, and for a reason the lock file cannot cover: a wheel ships
    # no lock, so a consumer resolves from these ranges alone.
    #
    # `<2` is not caution. mcp 2.0.0 removed `mcp.server.fastmcp` outright — there is no FastMCP
    # under that path or any other — and it declares `Requires-Python: >=3.10`, so it is an
    # eligible candidate on every interpreter this project supports. Uncapped, a clean install
    # resolved it on 3.13 and the server died on import with ModuleNotFoundError; 3.12 escaped
    # only through a warm cache, not through any constraint. Lifting this means porting to 2.x's
    # replacement API, not relaxing a bound.
    "mcp>=1.29.0,<2",
    # The floor stays explicit: loosen it and resolution fails outright, backtracking to a
    # release whose urwid uses `use_2to3`, which modern setuptools rejects. The ceiling is the
    # same exposure as above rather than a known break — capture is written against mitmproxy 12's
    # addon hooks and its filter expression language, and a major version is free to move both.
    "mitmproxy>=11,<13",
]

[project.scripts]
https-proxy-mcp = "https_proxy_mcp:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A per-test cap, so a hung test fails fast and *located* instead of burning the CI job's whole
# 20-minute timeout-minutes — on this private repository's 10x-billed macOS runners one hang
# costs ~200 of the ~200 real macOS minutes in the monthly allowance. 120s is generous: the
# full suite takes under a minute locally, and the slowest integration tests (building a wheel,
# installing it under a clean interpreter) finish in seconds. A test that legitimately needs
# longer gets a larger cap here rather than a narrower behaviour.
#
# The machine-gated tests are the exception: they boot real simulators and install real
# drivers, so tests/conftest.py gives the `machine` marker a much larger cap through
# pytest-timeout's marker, which outranks this value. Their HTTPS_PROXY_MCP_E2E gate is
# untouched by any of this.
timeout = 120
markers = [
    "integration: binds real sockets or spawns real processes. Deselect with -m 'not integration'.",
    # Gated by HTTPS_PROXY_MCP_E2E=1 rather than by this marker, because a command-line -m
    # replaces any default expression from addopts — so `-m 'not integration'` would have
    # silently opted back in to redirecting the machine's networking.
    "machine: changes the developer's real system proxy. Requires HTTPS_PROXY_MCP_E2E=1.",
]
# Warnings fail the run: a warning that only reaches a report is a warning nobody reads, so the
# default is `error` and every exception is argued for individually. pytest applies these filters
# in order and later entries win, so the narrowing must follow the `error`, never precede it.
#
# The one exception is mitmproxy calling deprecated pyparsing and pyasn1 APIs — there is nothing
# to fix on this side of the dependency, and the category is narrowed to deprecations so every
# other warning ours or theirs still fails loudly.
filterwarnings = [
    "error",
    "ignore:.*deprecated.*:DeprecationWarning",
]

[tool.coverage.report]
# Measured 97% on the full suite on main (2026-09-16, post-Human-View: 1022 passed, the 3
# machine-gated tests skipped, 2180 statements, 57 missed) — not transcribed from the research,
# whose 92% predates that merge. The floor sits a couple of points under the measurement and is
# deliberately not a round number: it is insurance against regression, not a target to grow
# toward.
#
# It is also a floor on the *total*, not per module, and it stays low enough that the
# machine-mutating modules feel no pressure toward more elaborate fakes: targets/systemproxy.py
# measures 95% and targets/simctl.py 96% with the world outside the three gated tests faked by
# design, and the lowest module (runs/process.py, 90%) is subprocess orchestration, not a gap to
# close with a bigger harness. If a future change drops the total, the fix is a test or a
# lowered-and-argued floor here — never a machine fake.
fail_under = 96
# The standard conventions, kept short. None of these shapes exist in src/ today — they are
# declared so that typing ceremony and abstract markers never count against the floor when they
# do appear. coverage.py's own default (the pragma) must be restated: setting exclude_lines
# replaces it.
exclude_lines = [
    "# pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
strict = true
files = ["src"]
# Dead code that only exists on paper — a branch after a return, a condition that cannot hold —
# is usually a sign the author was wrong about the types. Strict mode does not flag it on its
# own; without this, `mypy --strict` is green over code it never looked at.
warn_unreachable = true
# `tests/` is deliberately out of scope. Under --strict it reports ~870 findings, almost all of
# them a missing `-> None` on a test function, and a mechanical edit across 41 files would bury
# anything real in the same diff — the objection this project already applies to `ruff format`.
# It is a separate, deliberate commit if it is ever wanted, not a side effect of typing `src`.

[[tool.mypy.overrides]]
# mitmproxy ships `py.typed`, but several of the functions this project must call through are
# themselves unannotated: `options.update`, `addons.add`, `addons.get`, `master.shutdown` and
# `headers.items`. Calling them from strict code is eight `no-untyped-call` errors that say
# nothing about this codebase.
#
# Declared here as a boundary rather than silenced with eight inline `# type: ignore`s, for the
# reason CONTEXT.md gives for allowing mitmproxy's word "flow" in exactly two modules: the
# boundary with someone else's library is a real thing, and it is better named once than
# rediscovered at each call site. Every other strictness setting still applies to these modules.
module = ["https_proxy_mcp.capture.addon", "https_proxy_mcp.capture.runtime"]
disallow_untyped_calls = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Ruff formats Python blocks inside Markdown by default; the docs are prose, not code.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# ASYNC guards ADR-0001's single event loop: the proxy runs on the server's loop, so a blocking
# call inside an async function stalls capture for every Exchange. Measured clean across src/
# (2026-09-16, post-Human-View), so the family lands as a pure guard — any future hit is a real
# stall, not a migration.
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests block on purpose: they simulate the world the proxy captures — a hanging sink, a
# subprocess the Run window must outlive, a `time.sleep` standing in for a slow device. The
# measured seven (tests/test_passthrough.py, test_pending_e2e.py, test_run_process.py,
# test_runtime.py, test_simulator_e2e.py, test_tools_trust.py) are declared here rather than
# rewritten into asyncio shapes that would stop resembling the world.
"tests/**" = ["ASYNC110", "ASYNC220", "ASYNC221", "ASYNC240", "ASYNC251"]
